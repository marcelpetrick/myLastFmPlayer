[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "my-lastfm-player"
description = "Linux desktop app for fetching Last.fm loved tracks and preparing local playback."
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [
    { name = "Marcel Petrick", email = "mail@marcelpetrick.it" }
]
dynamic = ["version"]
dependencies = [
    "pylast==7.2.0",
    "PyQt6==6.12.1",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pylint==4.1.4",
    "mutmut==3.8.1",
    "mypy==2.4.1",
    "ruff==0.17.5",
    "sphinx==9.2.0",
]

[project.scripts]
my-lastfm-player = "my_lastfm_player.main:main"

[tool.setuptools.packages.find]
include = ["my_lastfm_player*"]

[tool.setuptools.package-data]
my_lastfm_player = ["translations/*.qm", "translations/*.ts"]

[tool.setuptools.dynamic]
version = { attr = "my_lastfm_player.version.__version__" }

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=my_lastfm_player",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=99",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["my_lastfm_player"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint.main]
py-version = "3.14"
jobs = 0
recursive = true

[tool.pylint.messages_control]
disable = [
    "attribute-defined-outside-init",
    "broad-exception-caught",
    "duplicate-code",
    "fixme",
    "import-outside-toplevel",
    "invalid-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "no-name-in-module",
    "protected-access",
    "too-few-public-methods",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "unnecessary-ellipsis",
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.14"
files = ["my_lastfm_player"]
# The PyQt6 stubs mark nearly every Qt getter as Optional (statusBar(), header(), ...)
# and every event-handler parameter as Optional, which turns idiomatic Qt code into
# noise. A None that really slips through crashes at runtime and the tests catch it.
disable_error_code = ["union-attr", "override"]

[tool.mutmut]
source_paths = ["my_lastfm_player/"]
pytest_add_cli_args = ["--no-cov", "-q"]
pytest_add_cli_args_test_selection = ["tests/"]
# Qt is not fork-safe: never fork workers from a process that already ran the GUI tests.
process_isolation = "forkserver"
# mypy is a pipeline gate, so a mutant that breaks the declared types (e.g. a bool
# flag set to None, a required argument dropped) is caught before any test runs.
type_check_command = ["mypy", "--output", "json"]
# Log calls are diagnostics, not behaviour (PIT skips logging calls by default too).
# A pattern skips the whole call expression that starts on the matching line.
do_not_mutate_patterns = [
    '\bLOGGER\.(debug|info|warning|error|exception|critical)\(',
    '\b_log_(info|warning)\(',
]
also_copy = [
    "README.md",
    "LICENSE",
    "setup.py",
    "localPipeline.sh",
    "docs/",
    "documents/",
    "tools/",
    "media/",
    ".github/",
]
